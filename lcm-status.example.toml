# lcm-status configuration. Copy to /etc/lcm-status.toml and edit.
# Every field has a default; you only need to list what you're changing.

[display]
serial_device = "/dev/ttyS1"
scroll_step_ms = 300      # ms per character-step while scrolling (~3.3 chars/sec)
scroll_max_chars = 64     # longest text kept for scrolling; longer is truncated
scroll_pause_ms = 800     # pause at start/end of a scroll cycle
scroll_gap = 4            # blank chars between a scrolling line's end and its restart

[rotation]
dwell_secs = 5            # how long a short (non-scrolling) screen stays up
resume_after_secs = 30    # resume auto-rotation this long after manual UP/DOWN

[menu]
confirm_timeout_secs = 10 # auto-cancel a shutdown/restart/eject confirm screen

[sleep]
enabled = true
start = "22:00"
end = "06:00"
lcd_off = true            # display fully off at night (backlight too); buttons still
                          # wake it. false = only blank the text (backlight glows)

# Weekly power schedule, like ADM's Control Panel -> Hardware -> Power ->
# Power Schedule. One [[power_schedule]] block per rule; none (the
# default) means no schedule. Commented out here because deploy.sh
# installs this file as the live config -- uncomment and edit to use.
#
#   days    list of "sun".."sat" (or full names), and/or the shorthands
#           "daily", "weekdays" (mon-fri), "weekends" (sat+sun). A single
#           string works too: days = "weekdays".
#   time    24h "HH:MM", local time (DST handled).
#   action  "power_on"  -- wake from soft-off via the RTC alarm. The daemon
#                          keeps the alarm set for the next power_on at all
#                          times, so the NAS wakes on schedule however it
#                          was shut down (schedule, front panel, TrueNAS UI).
#                          Needs BIOS ErP/EuP off; can't wake the box after
#                          an AC power loss.
#           "shutdown"  -- (ADM's "power_off" also accepted)
#           "restart"
#   countdown_secs  shutdown/restart only: front-panel countdown before it
#           happens; any button cancels it. Default 60, 0 = immediately,
#           max 3600.
#   enabled  default true.
#
# A shutdown/restart only fires if the daemon is running as its minute
# arrives -- never retroactively at startup -- so a restart rule can't
# reboot-loop. `lcm-status check-config` and `lcm-status status` show the
# next scheduled events.
#[[power_schedule]]
#days = "weekdays"
#time = "07:30"
#action = "power_on"
#
#[[power_schedule]]
#days = ["sat", "sun"]
#time = "09:00"
#action = "power_on"
#
#[[power_schedule]]
#days = "daily"
#time = "23:30"
#action = "shutdown"
#countdown_secs = 120

[socket]
path = "/run/lcm-status.sock"
group = "builtin_administrators"

[screens]
network = true
pools = true               # pool capacity + health, merged into one screen per pool
hdd = true                 # SMART health + temp, merged into one screen per drive
temperature = true         # CPU temp + the one real fan (others are unpopulated headers)
docker = true
# Rotation order. Categories left out are appended in this default order,
# so e.g. ["docker"] just moves docker to the front.
order = ["network", "pools", "hdd", "temperature", "docker"]

# LCD text for each screen, as {variable} templates. The panel is 16 chars
# wide; anything longer scrolls (up to [display].scroll_max_chars). Leave a
# whole block out to keep its defaults; a block that sets only one line
# leaves the other line blank. An unknown {variable} is reported at startup
# (and by `lcm-status check-config`), and that one screen falls back to
# its default. Use {{ and }} for literal braces. Trailing spaces are
# trimmed, so a trailing variable that comes out empty (e.g. hdd {temp}
# with no reading) doesn't leave a gap. Preview with `lcm-status hal-test`.
[templates.network]        # one per physical NIC
# {iface} {ip} (empty if none) {link} ("up"/"down")
# {ip_or_status} (IP, else "connected, no IP" / "disconnected")
line0 = "{iface}"
line1 = "{ip_or_status}"

[templates.pool]           # one per zpool
# {name} {size} {alloc} {free} {cap} (e.g. "42%") {health}
line0 = "{name}: {health}"
line1 = "{alloc}/{size} {cap}"

[templates.hdd]            # one per disk
# {label} ("BAY3 sda", or just "nvme0n1" for non-bay drives) {bay} (empty
# for NVMe) {dev} {status} (PASSED/FAILED/STANDBY/UNKNOWN/N/A)
# {temp} (e.g. "34C", in [temperature].units; empty if no reading)
line0 = "{label}"
line1 = "{status} {temp}"

[templates.cpu]
# {temp} (number, in [temperature].units) {unit} ("C"/"F")
# {warn} (" !" at/above warn_threshold, else empty)
line0 = "CPU"
line1 = "{temp}{unit}{warn}"

[templates.fan]
# {rpm}
line0 = "FAN"
line1 = "{rpm} RPM"

[templates.docker]         # one per unhealthy container
# {name} {status} (docker ps status text)
line0 = "DOCKER {name}"
line1 = "{status}"

[refresh]
# Floors, not polling intervals -- refresh actually happens right before a
# screen is (re)displayed, never more often than this even if the rotation
# loop is faster.
network_min_secs = 10
pools_min_secs = 30
hdd_min_secs = 300        # SMART queries; kept slow to avoid waking spun-down drives
temperature_min_secs = 10
docker_min_secs = 10

[temperature]
units = "c"                 # "c" or "f" for the CPU and HDD screens (display only -- thresholds below are always degrees C)
# Fallback for any sensor not matched by [[temperature.thresholds]] below --
# highlights the temperature screen's "!" and, via syslog
# (monitor::HealthMonitor), logs a WARNING/CRITICAL on the transition into
# and back out of threshold. Mainly hits the ACPI thermal zone and the
# IT8625's sensors on this board.
warn_threshold = 75.0
critical_threshold = 85.0

# Per-chip overrides, matched by hwmon chip name (`cat
# /sys/class/hwmon/hwmon*/name`) -- a CPU, an HDD, and an NVMe SSD have
# very different safe operating ranges, so one global pair is a blunt
# instrument. These three are sourced from each part's actual datasheet
# (2026-09-23), not guessed -- see config.rs's default_temp_thresholds()
# doc comment for the research and sources. Adjust `chip` if your hardware
# differs (check `lcm-status fan-profile`'s sensor inventory for what's on
# your box).
[[temperature.thresholds]]
chip = "coretemp"           # Intel Celeron N5105: Intel ARK lists TjMax (throttle point) at 105C
warn_threshold = 85.0
critical_threshold = 100.0

[[temperature.thresholds]]
chip = "drivetemp"          # WD Ultrastar DC HC550: datasheet operating range is 5-60C
warn_threshold = 50.0
critical_threshold = 60.0

[[temperature.thresholds]]
chip = "nvme"                # WD Black SN750: datasheet operating (composite) temp is 0-70C
warn_threshold = 60.0
critical_threshold = 70.0

[[temperature.thresholds]]
chip = "enp9s0"              # AQC113 10GbE PHY/MAC (hwmon is named after the interface); ADM's LAN-chip curve: 70/80/100C
warn_threshold = 80.0
critical_threshold = 100.0

[docker]
ignore = []                # container names to exclude from health checks

[led]
nic_mode = "link"          # "link" (solid while connected) or "activity" (dark, flashes on traffic)
# Applies to every NIC with r8169 front LEDs (both RTL8125s here). Needs
# the ledtrig-netdev kernel module, which the daemon loads at startup; if
# it can't be applied, a WARNING is logged once (journalctl -u lcm-status).
# Front LEDs share [sleep]'s schedule for night mode -- one schedule for
# both the LCD backlight and the LEDs, not two. Red bay LEDs are always
# left alone by night mode so a real drive failure still shows.
#
# Brightness (0-100) of the power, status, LAN and USB LEDs -- the bay
# LEDs have no brightness control. Unset leaves the BIOS level (~80%).
# Needs the fork's it87 loaded with led_pwm=3 led_pwm_invert=1 (the
# /sys/class/leds/front_panel::brightness LED); without it, a WARNING is
# logged once and brightness is left alone.
# brightness = 60
# Set this to keep those LEDs on, dimmed, at night instead of switching
# them off (bay green LEDs go dark at night either way).
# night_brightness = 5
# Bay green LEDs: "ready" (solid while a disk is present, blinks off on
# access -- factory) or "activity" (dark, flashes on access). Unset leaves
# the driver's setting alone. Needs the platform driver's runtime-writable
# disk_led_ready; an older driver logs a warning instead.
# bay_mode = "activity"

[network]
# Feeds the status LED (amber/red) from monitored NICs' link state, in
# addition to pool health/temps/fan health -- see state::recompute_status_led.
enabled = true
# Which interfaces to monitor. Empty (default) means "whatever currently
# has an IP" (auto-adjusts as interfaces are configured/unconfigured in
# TrueNAS's own Network settings) -- an installed-but-unconfigured card
# (e.g. an AQC113 with no cable/IP yet) is correctly never treated as
# "down" this way. Set explicitly (e.g. ["enp2s0", "enp3s0"]) to pin the
# list instead -- for example, to monitor a NIC before it has an address,
# or exclude one that does.
monitored_nics = []
# Status-LED severity when some (but not all) monitored NICs are down --
# vs. when *every* one is (a real total outage, normally worse). "warning"
# or "error" (matches the socket protocol's Warn/Error levels).
some_down_level = "warning"
all_down_level = "error"

[buzzer]
# The chassis beeper, like ADM's "enable buzzer". Off by default.
enabled = false
boot = true               # one long beep (800 ms) when the daemon starts during boot
power = true              # one short beep (200 ms) before a shutdown/restart,
                          # including one the OS starts (the daemon is stopped)
alerts = true             # short beep on a SHOW that beeps (default: error once, critical
                          # again every minute until cleared; see beep= in the README);
                          # arrival beeps at most once a minute; during the [sleep]
                          # window only critical
find_me = true            # short beep when a chassis LOCATE starts

[wol]
# Interfaces to keep Wake-on-LAN enabled on -- set at startup, rechecked
# every 60s (some drivers reset it on link changes), and once more as the
# daemon stops during shutdown. Empty (default) = WOL not touched at all.
# `lcm-status status` shows every NIC's current WOL mode and what it
# supports. For the box to actually power on from soft-off, the BIOS must
# have ErP/EuP OFF and wake on PCIe/LAN enabled; it can't wake after a
# full power loss (that's the BIOS's "restore on AC power loss").
nics = []                  # e.g. ["enp2s0"]
# ethtool-style flags (`ethtool -s IFACE wol <mode>`), replacing the NIC's
# whole setting: "g" = magic packet; also p/u/m/b/a; "d" = keep WOL off.
mode = "g"

# One [[fans]] block per physical fan -- replaces lm-sensors' fancontrol
# package entirely (see src/fan.rs for why, and src/fan_calibrate.rs / the
# `lcm-status fan-profile` command for how to discover real values for
# your own board instead of guessing). Omitting [[fans]] entirely uses
# this board's built-in default (config::default_fans()), which is what
# the block below actually is -- shown explicitly so it's clear what's
# tunable. If you add your own [[fans]], it REPLACES the default(s), it
# doesn't merge with them.
[[fans]]
name = "chassis"
enabled = true
pwm_chip = "it8625"    # hwmon chip name exposing the pwm output
pwm_index = 1          # -> pwm1 / pwm1_enable
fan_index = 1          # -> fan1_input, for stall detection; omit if no tach
update_secs = 1        # how often to re-evaluate the curve and rewrite pwm
# "curve" (default): pwm from the temperature curve below. "fixed": a
# constant fixed_pwm (ADM's fixed fan mode) -- except that while any sensor
# below is at/above its [[temperature.thresholds]] critical_threshold, the
# fan runs at max_pwm until every sensor is back under its warn_threshold.
# Fixed mode still needs [[fans.sensors]] for that, and keeps the stall
# kicks and RPM checks. fixed_pwm must be within min_pwm..=max_pwm.
mode = "curve"
# fixed_pwm = 100      # only with mode = "fixed"
min_temp_c = 45.0      # at/below this, pwm = min_pwm
max_temp_c = 90.0      # at/above this, pwm = max_pwm
min_start_pwm = 60     # PWM needed to get a *stopped* fan spinning again
min_stop_pwm = 55      # once running, allowed to coast down to here before stopping (also the ramp's value at min_temp_c -- see src/fan.rs)
min_pwm = 50           # flat PWM used at/below min_temp_c (0 = let the fan stop)
max_pwm = 255          # flat PWM used at/above max_temp_c, 255 = fully on
# Log a syslog WARNING if this fan is confirmed running but its RPM is
# below this -- catches "spinning, but slower than it should be" (bearing
# wear, partial obstruction) before it becomes an outright stall. Omit to
# disable the check. `lcm-status fan-profile` reports max RPM at pwm=255;
# ~60-70% of that is a reasonable starting point.
min_expected_rpm = 500
# (Separately, an outright stall -- confirmed 0 RPM -- always logs a
# WARNING on the first restart attempt and escalates to CRITICAL if it's
# still not spinning after a few consecutive attempts. No config for that;
# see src/fan.rs's UNRESPONSIVE_AFTER_STALLS.)

# Sensors feeding this fan -- each is evaluated against its OWN curve
# (min_temp_c/max_temp_c below, falling back to this fan's own if unset),
# and the fan runs at whichever sensor's curve currently demands the
# highest PWM -- not "take the max raw temperature, then feed it through
# one shared curve". That distinction matters: a drive at its own 60C
# critical threshold should mean max_pwm right now, even though this fan's
# own curve (tuned for the CPU) doesn't reach max_temp_c until 90C. `chip`
# alone matches every instance of that hwmon chip (e.g. every populated
# drive bay for "drivetemp"); narrow with `label`/`input` for a chip with
# several temps where only some should count. A disconnected sensor
# (fault flag set, or an implausible reading) is silently excluded, not
# treated as 0 -- see hal::read_temp_input.
[[fans.sensors]]
chip = "coretemp"
label = "Package"       # only the package temp, not individual cores
# No min_temp_c/max_temp_c override here -- shares this fan's own 45-90C
# curve, the original hand-tuned values for this CPU.

[[fans.sensors]]
chip = "drivetemp"      # every SATA bay's drive, whichever is hottest
min_resample_secs = 30  # changes slowly; no need to reread every update_secs
# Overridden to this drive's own warn/critical thresholds (see
# [[temperature.thresholds]] with chip = "drivetemp" above) rather than
# sharing the CPU's 45-90C curve -- keep these two in sync if you change
# one.
min_temp_c = 50.0
max_temp_c = 60.0

[[fans.sensors]]
chip = "nvme"            # every NVMe controller, whichever is hottest
min_resample_secs = 30
# Same reasoning as drivetemp above -- matches this SSD's own
# [[temperature.thresholds]] entry.
min_temp_c = 60.0
max_temp_c = 70.0

[[fans.sensors]]
chip = "enp9s0"          # AQC113 10GbE card (PHY/MAC, whichever is hotter)
min_resample_secs = 10
# ADM's LAN-chip curve, full speed at this chip's critical threshold.
min_temp_c = 70.0
max_temp_c = 100.0
