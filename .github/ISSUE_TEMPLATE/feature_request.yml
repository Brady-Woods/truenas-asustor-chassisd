name: Feature request
description: Suggest an improvement to lcm-status or deploy.sh
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: |
        What should change? If it mirrors an ADM feature, say how ADM behaves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: setup
    attributes:
      label: NAS model and TrueNAS SCALE version (if relevant)
      placeholder: "AS6704T, 25.10.3.1"
